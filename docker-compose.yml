# GeoForest Trace — lancement local / conteneurisé :
#   1. Base + migrations versionnées + RLS (étape ponctuelle dédiée) :
#        docker compose up -d db
#        docker compose --profile migrate run --rm migrate
#   2. Application Next.js (rôle geoforest_app, sans DATABASE_URL_ADMIN) :
#        docker compose up --build frontend
#   Frontend (Next.js)  : http://127.0.0.1:3000
#   Backend  (FastAPI)  : retiré du déploiement (chantier 2, « B-8 ») : le produit ne l'appelle pas
#   PostgreSQL          : 127.0.0.1:5432 (boucle locale uniquement)
services:
  db:
    image: postgres:16-alpine
    container_name: geoforest-db
    environment:
      POSTGRES_USER: postgres
      # P0 (recette 2026-10-08) : aucun mot de passe par défaut. Renseigné par
      # l'environnement d'exécution (fichier .env non versionné).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}
      POSTGRES_DB: app_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - geoforest-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geoforest-migrate
    profiles:
      - migrate
    environment:
      # Seule cette tâche ponctuelle détient le rôle d'administration pour jouer
      # `drizzle/` + `scripts/sql/post-migrate/` (RLS, privilèges, journal d'audit).
      DATABASE_URL_ADMIN: postgresql://postgres:${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}@db:5432/app_db
      GF_APP_DB_PASSWORD: ${GF_APP_DB_PASSWORD:?définir GF_APP_DB_PASSWORD}
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geoforest-frontend
    environment:
      # L'application se connecte uniquement avec le rôle geoforest_app (NOBYPASSRLS).
      # DATABASE_URL_ADMIN n'est volontairement jamais injectée dans ce conteneur.
      DATABASE_URL: postgresql://geoforest_app:${GF_APP_DB_PASSWORD:?définir GF_APP_DB_PASSWORD}@db:5432/app_db
      GF_STORAGE_DIR: /app/var/storage
      GFW_API_KEY: ${GFW_API_KEY:-}
      GFW_LIVE_ENABLED: ${GFW_LIVE_ENABLED:-true}
      # B-2 (chantier 5) : secrets obligatoires en production. Sans eux, l'application
      # refuse de démarrer (AUTH_SECRET) ou refuse tout téléchargement de pièce (signature).
      AUTH_SECRET: ${AUTH_SECRET:?définir AUTH_SECRET (≥ 32 caractères)}
      GF_STORAGE_SIGNING_SECRET: ${GF_STORAGE_SIGNING_SECRET:?définir GF_STORAGE_SIGNING_SECRET (≥ 32 caractères)}
    ports:
      - "3000:3000"
    volumes:
      - geoforest-storage:/app/var/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  geoforest-pgdata:
  geoforest-storage:
