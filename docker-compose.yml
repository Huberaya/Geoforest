# GeoForest Trace — lancement complet : `docker-compose up --build`
#   Frontend (Next.js)  : http://localhost:3000
#   Backend  (FastAPI)  : http://localhost:8000/docs
#   PostgreSQL          : localhost:5432 (persistance des audits côté Next.js)
services:
  db:
    image: postgres:16-alpine
    container_name: geoforest-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - geoforest-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geoforest-backend
    environment:
      DATABASE_PATH: /app/data/geoforest.db
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000
      GFW_API_KEY: ${GFW_API_KEY:-}
      GFW_LIVE_ENABLED: ${GFW_LIVE_ENABLED:-true}
      # ⚠️ Ce backend est mono-tenant et n'a aucune notion d'organisation.
      #   Sans jeton, ses routes de données répondent 503 (échec fermé).
      GF_BACKEND_TOKEN: ${GF_BACKEND_TOKEN:-}
    ports:
      # Écoute sur la boucle locale uniquement : le service n'a pas à être
      # joignable depuis le réseau. Pour un accès distant, passer par un
      # mandataire authentifié, jamais par une publication directe.
      - "127.0.0.1:8000:8000"
    volumes:
      - geoforest-backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geoforest-frontend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app_db
      # Laisser vide : le dashboard utilise les routes API Next.js intégrées
      # (PostgreSQL, multi-tenant, RLS). Le backend FastAPI est un service
      # mono-tenant, authentifié par jeton de service ; il n'est pas destiné à
      # être appelé depuis le navigateur (le jeton y serait exposé).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      GFW_API_KEY: ${GFW_API_KEY:-}
      GFW_LIVE_ENABLED: ${GFW_LIVE_ENABLED:-true}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  geoforest-pgdata:
  geoforest-backend-data:
