# GeoForest Trace — lancement complet : `docker-compose up --build`
#   Frontend (Next.js)  : http://localhost:3000
#   Backend  (FastAPI)  : http://localhost:8000/docs
#   PostgreSQL          : localhost:5432 (persistance des audits côté Next.js)
services:
  db:
    image: postgres:16-alpine
    container_name: geoforest-db
    environment:
      POSTGRES_USER: postgres
      # P0 (recette 2026-10-08) : aucun mot de passe par défaut. Renseigné par
      # l'environnement d'exécution (fichier .env non versionné).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - geoforest-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geoforest-backend
    environment:
      DATABASE_PATH: /app/data/geoforest.db
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000
      GFW_API_KEY: ${GFW_API_KEY:-}
      GFW_LIVE_ENABLED: ${GFW_LIVE_ENABLED:-true}
    ports:
      - "8000:8000"
    volumes:
      - geoforest-backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geoforest-frontend
    environment:
      # L'application se connecte avec le rôle geoforest_app, soumis à la RLS.
      # Le superutilisateur ne sert qu'aux migrations (DATABASE_URL_ADMIN).
      DATABASE_URL: postgresql://geoforest_app:${GF_APP_DB_PASSWORD:?définir GF_APP_DB_PASSWORD}@db:5432/app_db
      DATABASE_URL_ADMIN: postgresql://postgres:${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}@db:5432/app_db
      # Laisser vide pour utiliser les routes API Next.js intégrées (PostgreSQL),
      # ou pointer vers le backend FastAPI : http://localhost:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      GFW_API_KEY: ${GFW_API_KEY:-}
      GFW_LIVE_ENABLED: ${GFW_LIVE_ENABLED:-true}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  geoforest-pgdata:
  geoforest-backend-data:
