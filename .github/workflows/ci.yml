name: CI

on:
  # Déclencheurs union des deux lignes de travail : `main`, les branches de
  # session `arena/**`, et les branches historiques `forest/**` / `security/**`.
  # Aucun déclencheur n'a été retiré.
  push:
    branches:
      - main
      - "arena/**"
      - "forest/**"
  pull_request:
    branches:
      - main
      - "arena/**"
      - "security/**"
      - "forest/**"
  workflow_dispatch:

# Moindre privilège : le workflow ne lit que le dépôt.
permissions:
  contents: read

concurrency:
  group: geoforest-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Compilation, typage, lint, contrôles unitaires et métier, backend, build.
  # Aucune base de données n'est fournie : le build doit réussir sans.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify Frontend & Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies & test
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # `--strict-markers` (repris de main, 04/11/2026) : un test qui se
          # saute doit le déclarer par un marqueur connu ; les 3 tests
          # geospatial sont `skipped` et affichés, jamais comptés verts.
          pytest -q --strict-markers

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Le dépôt est développé sous Node 22 (`@types/node` épinglé en 22).
          node-version: 22
          cache: npm

      - name: Install frontend dependencies (lockfile strict)
        run: npm ci

      - name: Workflow regression tests
        run: npm run test:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Schema drift (schema.ts vs Drizzle journal, no database)
        run: npm run db:check

      - name: Lint
        run: npm run lint

      # Suite de régression du dépôt (`tests/unit/*.test.ts`) : garde-fou de
      # schéma, rôle applicatif, identité, cadence, routes, comptes de démo.
      - name: Unit tests
        run: npm run test:unit

      # Contrôles hérités de la ligne `integration/` : pool paresseux, identité
      # du lot A, règles de supervision, topologie, DDS, pack de preuves.
      - name: Contrôles métier (ligne d'intégration)
        run: npm run test:controles

      - name: EUDR rules tests
        run: npm run test:eudr

      # Contrôles repris de `main` (04–05/11/2026, chantiers C1–C3) : cohérence
      # de la version annoncée par la sonde, garde-fous de l'amorçage, et
      # cohérence entre les chiffres de la documentation et le code.
      - name: Cohérence de la version et du moteur Node
        run: npm run check:version

      - name: Garde-fous de l'amorçage de démonstration
        run: npm run check:seed

      - name: Cohérence entre la documentation et le code
        run: npm run check:docs

      # Le build s'exécute sans base : c'est la propriété que le pool
      # d'administration différé garantit.
      - name: Build
        run: npm run build

      # Repris de `main` : un build qui écrit dans un fichier du produit finit
      # commité par accident. `next-env.d.ts` est exclu (généré par Next).
      - name: Le build n'a modifié aucun fichier du produit
        run: |
          set -euo pipefail
          modifications="$(git status --porcelain -- . ':(exclude)next-env.d.ts')"
          if [ -n "$modifications" ]; then
            echo "🔴 Le build a modifié des fichiers versionnés :"
            echo "$modifications"
            git diff -- . ':(exclude)next-env.d.ts'
            exit 1
          fi
          echo "✅ Aucun fichier du produit modifié par le build."

      # Contrôle des dépendances de production. Les avis portant sur des
      # outils de développement sont suivis séparément (`npm run audit:dev`).
      - name: Audit des dépendances de production
        run: npm run audit:sec

  # ---------------------------------------------------------------------------
  # Contrats de base et contrats HTTP sur PGlite (PostgreSQL embarqué, WASM).
  # Aucun serveur externe, aucune variable d'environnement, aucun réseau : ce
  # job vérifie la RLS et les routes sans dépendre de Neon.
  # ---------------------------------------------------------------------------
  base-et-http:
    name: Base de données et contrats HTTP (PGlite)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile strict)
        run: npm ci

      - name: Tests SQL (rôles, RLS, privilèges, cadence, état de schéma)
        run: npm run test:sql

      - name: Tests HTTP (isolation, authentification, limites, schéma incomplet)
        run: npm run test:http

  # ---------------------------------------------------------------------------
  # Contrôles exigeant une vraie base PostgreSQL (repris de `main`, 04/11/2026) :
  # délais du pool, migrations sur base vierge, dérive schéma/migrations,
  # idempotence, retour arrière puis remontée. Service jetable du runner.
  # ---------------------------------------------------------------------------
  base:
    name: Contrôles SQL (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DATABASE_URL_ADMIN: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile strict)
        run: npm ci

      - name: Délais du pool réellement appliqués par PostgreSQL
        run: npx tsx scripts/check-sql-limits.ts

      - name: Migrations sur base vierge
        run: npm run db:migrate

      # Une dérive entre `src/db/schema.ts` et `drizzle/` signifie qu'une
      # migration a été oubliée : en production, erreur 500 à la première requête.
      - name: Aucune dérive entre le schéma et les migrations
        run: npm run check:schema

      - name: Migrations idempotentes (rejeu sans effet)
        run: npm run db:migrate

      - name: Retour arrière puis remontée
        run: |
          set -euo pipefail
          npm run db:rollback
          npm run db:migrate

  # ---------------------------------------------------------------------------
  # Bout en bout sur PostgreSQL du runner (repris de `main`, 04/11/2026) :
  # l'application **démarrée** — sondes, contrôle de rôle au démarrage, 2FA,
  # parcours métier, isolation entre deux organisations. Mesuré le 04/11 : un
  # build vert et des migrations vertes n'empêchaient pas un serveur qui
  # refusait toutes ses requêtes (500).
  # ---------------------------------------------------------------------------
  bout-en-bout:
    name: Bout en bout (application démarrée, PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DATABASE_URL_ADMIN: postgresql://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-secret-de-build-uniquement-non-utilise-en-production
      # Mot de passe des comptes de démonstration : il n'a de valeur que sur la
      # base jetable de ce job, détruite avec le runner.
      SEED_DEMO_PASSWORD: ci-mot-de-passe-de-demonstration-jetable
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile strict)
        run: npm ci

      - name: Migrations
        run: npm run db:migrate

      # Le rôle applicatif est créé sans mot de passe par la migration : le
      # script versionné lui en attribue un, et refuse toute base non jetable.
      - name: Attribuer un mot de passe au rôle applicatif (base jetable)
        run: npx tsx scripts/ci-mot-de-passe-role.ts
        env:
          GF_BASE_JETABLE: "oui"
          GF_MOT_DE_PASSE_APP: mot-de-passe-jetable-de-ci-pour-le-role

      - name: Build de production
        run: npm run build

      - name: Bout en bout (démarrage, sondes, auth, parcours, isolation)
        run: bash scripts/ci/annoter.sh "bout-en-bout" npm run check:e2e:complet
        env:
          DATABASE_URL: postgresql://geoforest_app:mot-de-passe-jetable-de-ci-pour-le-role@127.0.0.1:5432/ci
          DATABASE_URL_ADMIN: postgresql://ci:ci@127.0.0.1:5432/ci
          SEED_AUTORISE_HOTE_DISTANT: "oui"
          GF_STORAGE_DIR: /tmp/gf-stockage
          GF_E2E_PORT: "3110"
          GF_E2E_MOT_DE_PASSE: ci-mot-de-passe-de-demonstration-jetable

      - name: Journaux du serveur en cas d'échec
        if: failure()
        run: |
          echo "— journaux éventuels —"
          ls -la /tmp/gf-stockage 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Contrôles HTTP et base sur une branche Neon éphémère : ils modifient et
  # réinitialisent la base, donc ils ne tournent jamais sur une base partagée.
  # La branche est créée pour ce run et supprimée en fin de job.
  # ---------------------------------------------------------------------------
  database:
    name: Database & HTTP contracts (Neon branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      NEON_PARENT_BRANCH_ID: ${{ secrets.NEON_PARENT_BRANCH_ID }}
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies (lockfile strict)
        run: npm ci

      - name: Create ephemeral Neon branch
        run: npx tsx scripts/ci/neon-branche.ts creer

      - name: Apply migrations on the test branch
        run: npm run db:migrate

      - name: Set application role password (test branch only)
        run: npx tsx scripts/ci/neon-branche.ts role-app

      - name: Database controls
        run: npm run test:db

      - name: Reset demo accounts (test branch only)
        run: npm run seed:auth -- --reset

      - name: Build production bundle
        run: npm run build

      - name: Start production server
        run: |
          set -euo pipefail
          nohup npx next start -p 3000 -H 127.0.0.1 > "$RUNNER_TEMP/next.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/next.pid"
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/next.log"
          exit 1

      - name: End-to-end journey
        run: bash scripts/ci/annoter.sh "e2e" npm run test:e2e

      - name: Reset demo accounts before HTTP controls (test branch only)
        run: npm run seed:auth -- --reset

      - name: Cross-tenant HTTP controls
        run: bash scripts/ci/annoter.sh "cross-tenant" npm run test:cross-tenant

      - name: Reset demo accounts before HTTP controls (test branch only)
        run: npm run seed:auth -- --reset

      # Lot A : la route d'export réelle répond-elle 422 sans identité ?
      # Un test de la fonction pure ne le prouve pas (garde, statut, format).
      - name: Export identity HTTP controls
        run: bash scripts/ci/annoter.sh "export-identite:http" npm run test:export-identite:http

      - name: Reset demo accounts before HTTP controls (test branch only)
        run: npm run seed:auth -- --reset

      - name: Supplier journey HTTP controls
        run: bash scripts/ci/annoter.sh "fournisseur:http" npm run test:fournisseur:http

      # Suites HTTP historiques maintenues hors CI jusqu'ici : elles tournent
      # uniquement sur la branche Neon éphémère, avec comptes réinitialisés.
      - name: Reset demo accounts before DDS state-machine controls (test branch only)
        run: npm run seed:auth -- --reset

      - name: DDS state-machine HTTP controls
        run: bash scripts/ci/annoter.sh "dds-etats:http" npm run test:dds-etats:http

      - name: Reset demo accounts before evidence-pack controls (test branch only)
        run: npm run seed:auth -- --reset

      - name: Evidence-pack HTTP controls
        run: bash scripts/ci/annoter.sh "evidence:http" npm run test:evidence:http

      # La preuve RLS en base lit les lignes créées par TOUS les parcours HTTP
      # précédents (plots, fournisseurs, DDS, documents, journal) et échoue
      # volontairement si elle est vacueuse : elle vient donc en dernier.
      # Run 40930475126 (29/10/2026) : cette étape a échoué sans journal
      # exploitable ; ses échecs sont désormais relayés en annotations.
      - name: Cross-tenant database RLS controls
        run: bash scripts/ci/annoter.sh "cross-tenant:rls" npm run test:cross-tenant:rls

      - name: Stop production server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/next.pid" ]; then kill "$(cat "$RUNNER_TEMP/next.pid")" || true; fi

      - name: Delete ephemeral Neon branch
        if: always()
        run: npx tsx scripts/ci/neon-branche.ts supprimer
