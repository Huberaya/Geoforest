name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: geoforest-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Frontend & Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies & test
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          set -euo pipefail
          npm ci || npm install

      # Les contrôles EUDR ne dépendent ni de la base ni du réseau : ils
      # vérifient le validateur géospatial et le moteur de risque hors ligne.
      - name: Frontend EUDR & GIS checks
        run: npm run test:gis

      # ⚠️ Le build s'exécute SANS base de données, comme chez l'hébergeur.
      #   Il évaluait auparavant `src/db/admin.ts`, qui construisait un pool au
      #   niveau du module : le build échouait sur `/api/metrics`. Le test
      #   `test:demarrage` (inclus dans `test:gis`) verrouille cette propriété.
      - name: Build frontend
        run: npm run build
