name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: geoforest-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Frontend & Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies & test
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          set -euo pipefail
          npm ci || npm install

      # Les contrôles EUDR ne dépendent ni de la base ni du réseau : ils
      # vérifient le validateur géospatial et le moteur de risque hors ligne.
      - name: Frontend EUDR & GIS checks
        run: npm run test:gis

      # ⚠️ Défauts non géospatiaux consolidés en phase 3 : proxy paresseux
      #   (réflexion), migration 0007 sur base embarquée, refus du seed en
      #   production, portée mémoire de la limitation de débit.
      - name: Sécurité des garde-fous
        run: npm run test:securite

      # ⚠️ Production : zéro vulnérabilité connue. **Bloquant.**
      - name: Audit des dépendances de production
        run: npm run audit:sec

      # ⚠️ Développement : `braces` <= 3.0.3 n'a AUCUNE version corrigée
      #   (GHSA-vfj7-8cjw-p6xm, CVE-2026-93687). L'audit échoue, et cet échec
      #   est **visible** : il n'est ni neutralisé par `--omit=dev`, ni tu.
      #   Le rendre bloquant condamnerait toute la CI sans qu'aucune action ne
      #   puisse la débloquer. Il est donc publié sans interrompre le job, et
      #   le rapport de sécurité consigne le risque.
      #   À rendre bloquant dès qu'une version `braces > 3.0.3` existera.
      - name: Audit des dépendances de développement (informatif)
        continue-on-error: true
        run: npm run audit:dev

      # ⚠️ Le build s'exécute SANS base de données, comme chez l'hébergeur.
      #   Il évaluait auparavant `src/db/admin.ts`, qui construisait un pool au
      #   niveau du module : le build échouait sur `/api/metrics`. Le test
      #   `test:demarrage` (inclus dans `test:gis`) verrouille cette propriété.
      - name: Build frontend
        run: npm run build
