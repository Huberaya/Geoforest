name: Détection de secrets (Gitleaks)

on:
  push:
    branches:
      - main
      - "arena/**"
      - "forest/**"
      - "security/**"
      - "feat/**"
      - "fix/**"
      - "docs/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoforest-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Analyse de secrets (Gitleaks + garde locale)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Gitleaks épinglé (v8.30.1 + SHA-256 vérifié)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version

      - name: Scanner l'arbre courant (HEAD, valeurs masquées)
        run: |
          set -euo pipefail
          /tmp/gitleaks dir . --config .gitleaks.toml --redact --verbose --no-banner

      - name: Scanner les nouveaux commits de la PR / du push (valeurs masquées)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          RANGE=""
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${PR_BASE_SHA:-}" ] && [ -n "${PR_HEAD_SHA:-}" ]; then
            RANGE="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${PUSH_BEFORE}..${PUSH_AFTER}"
          fi
          if [ -n "$RANGE" ]; then
            echo "Analyse de la plage de commits : $RANGE"
            /tmp/gitleaks git . --config .gitleaks.toml --log-opts="$RANGE" --redact --verbose --no-banner
          else
            echo "Aucune plage incrémentale (branche neuve ou dispatch) : contrôle HEAD déjà exécuté."
          fi

      - name: Contrôle local complémentaire (scripts/check-secrets.ts)
        run: |
          set -euo pipefail
          npx --no-install tsx scripts/check-secrets.ts 2>/dev/null || (npm ci --ignore-scripts && npm run check:secrets)
